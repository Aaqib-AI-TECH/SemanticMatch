server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: let React Router (if ever added) handle unknown paths.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend container. "backend" resolves via the
    # Docker Compose network — see docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}

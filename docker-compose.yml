services:
  backend:
    build: ./backend
    container_name: semanticmatch-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: semanticmatch-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
